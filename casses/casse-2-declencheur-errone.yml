# PANNE 2 - a copier dans .github/workflows/ pour observer le bug.
#
# Symptome a observer : vous modifiez site/config.json, vous faites
# git push sur main... et rien ne se passe. Aucun run n'apparait dans
# l'onglet "Actions". Il n'y a aucune erreur : le workflow n'a simplement
# jamais ete declenche.
#
# Question : quel est le nom EXACT de l'evenement de push dans GitHub Actions ?
# La documentation dit "on: push" ou "on: pushes" ? Regardez attentivement.

name: Panne 2 - Declencheur errone

on:
  pushes:                       # ? quelque chose cloche ici
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python outils/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
