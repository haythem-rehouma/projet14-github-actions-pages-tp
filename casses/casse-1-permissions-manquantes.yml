# PANNE 1 - a copier dans .github/workflows/ pour observer le bug.
#
# Symptome a observer : le workflow s'execute jusqu'a la fin sans erreur
# de build, MAIS le job "deployer" echoue avec :
#
#   Error: Resource not accessible by integration
#
# Question : quelle section du fichier permet a un workflow d'ecrire sur
# GitHub Pages ? Ce fichier l'a-t-il correctement declaree ?

name: Panne 1 - Deployer sans permissions

on:
  push:
    branches: [main]

# ? une section entiere est manquante ici

concurrency:
  group: pages-panne-1
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python outils/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
