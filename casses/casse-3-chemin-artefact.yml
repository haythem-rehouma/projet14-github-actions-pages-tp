# PANNE 3 - a copier dans .github/workflows/ pour observer le bug.
#
# Symptome a observer : le job "construire" reussit (le script build.py
# affiche "OK dist/index.html genere"). Mais l'etape upload-pages-artifact
# echoue avec :
#
#   Error: Path does not exist: ./public
#
# Question : ou est-ce que outils/build.py ecrit le site construit ?
# Regardez le champ "path:" du step upload-pages-artifact.

name: Panne 3 - Mauvais chemin

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python outils/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public            # ? build.py ecrit-il vraiment ici ?

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
